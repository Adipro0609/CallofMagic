<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Call of Magic</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at top,
    #312e81 0%,
    #0f172a 50%,
    #020617 100%);

    color:white;
}

.container{
    width:340px;
    background:rgba(15,23,42,0.96);
    padding:30px;
    border-radius:25px;
    box-shadow:0 0 30px rgba(0,0,0,0.6);
}

.title{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    margin-bottom:25px;
    color:#c084fc;
    text-shadow:0 0 15px rgba(192,132,252,0.7);
}

.form-box{
    display:none;
}

.form-box.active{
    display:block;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    border-radius:14px;
    background:#1e293b;
    color:white;
    font-size:15px;
}

input:focus{
    outline:none;
    border:2px solid #a855f7;
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(to right,#7c3aed,#a855f7);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    transform:scale(1.03);
}

.or{
    text-align:center;
    margin:18px 0;
    color:#94a3b8;
}

.google-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:white;
    color:#111827;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
}

.google-logo{
    width:22px;
    height:22px;
}

.switch{
    text-align:center;
    margin-top:18px;
    color:#cbd5e1;
}

.switch span{
    color:#c084fc;
    cursor:pointer;
    font-weight:bold;
}

.message{
    margin-top:18px;
    text-align:center;
    min-height:24px;
    font-weight:bold;
}

/* MAGIC PORTAL */

#magicAnimation{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;

    background:#020617;

    justify-content:center;
    align-items:center;
    flex-direction:column;
}

#portal{
    font-size:130px;

    animation:
    spin 2s linear infinite,
    pulse 1s ease-in-out infinite;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}

/* LOBBY */

#lobby{
    display:none;
    position:fixed;
    inset:0;
    overflow:auto;

    background:
    radial-gradient(circle at top,
    #312e81 0%,
    #0f172a 50%,
    #020617 100%);

    padding:20px;
}

.lobby-title{
    text-align:center;
    margin-top:20px;
    color:#c084fc;
    font-size:36px;
}

.lobby-card{
    background:#1e293b;
    margin-top:20px;
    padding:20px;
    border-radius:20px;
}

.lobby-btn{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:15px;
    background:#7c3aed;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.logout-btn{
    background:#dc2626;
}

</style>
</head>

<body>

<div class="container">

    <div class="title">
        Call of Magic
    </div>

    <!-- LOGIN -->

    <div class="form-box active" id="loginForm">

        <input type="text"
        id="loginUser"
        placeholder="Username">

        <input type="password"
        id="loginPass"
        placeholder="Password">

        <button class="login-btn"
        onclick="login()">
            Login
        </button>

        <div class="or">OR</div>

        <button class="google-btn"
        onclick="googleLogin()">

            <svg class="google-logo"
            viewBox="0 0 48 48">

                <path fill="#FFC107"
                d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
            </svg>

            Log in with Google

        </button>

        <div class="switch">
            No account?
            <span onclick="showRegister()">
                Register
            </span>
        </div>

    </div>

    <!-- REGISTER -->

    <div class="form-box"
    id="registerForm">

        <input type="text"
        id="registerUser"
        placeholder="Create Username">

        <input type="password"
        id="registerPass"
        placeholder="Create Password">

        <button class="login-btn"
        onclick="register()">
            Register
        </button>

        <div class="switch">
            Already have an account?
            <span onclick="showLogin()">
                Login
            </span>
        </div>

    </div>

    <div class="message"
    id="message"></div>

</div>

<!-- MAGIC ANIMATION -->

<div id="magicAnimation">

    <div id="portal">🌀</div>

    <h1 style="color:#c084fc;">
        Entering Call of Magic...
    </h1>

</div>

<!-- LOBBY -->

<div id="lobby">

    <h1 class="lobby-title">
        ✨ Magic Lobby ✨
    </h1>

    <div class="lobby-card">
        🧙 Players Online:
        <span id="onlinePlayers"></span>
    </div>

    <div class="lobby-card">
        🎉 Successfully Logged In
    </div>

    <button class="lobby-btn">
        ⚔️ Ranked Match
    </button>

    <button class="lobby-btn">
        🏰 Guild Hall
    </button>

    <button class="lobby-btn">
        🎒 Inventory
    </button>

    <button class="lobby-btn logout-btn"
    onclick="logout()">
        Logout
    </button>

</div>

<script>

window.onload=function(){

    document.getElementById(
    "onlinePlayers").innerText =
    Math.floor(Math.random()*500)+100;
};

function showRegister(){

    loginForm.classList.remove("active");
    registerForm.classList.add("active");
}

function showLogin(){

    registerForm.classList.remove("active");
    loginForm.classList.add("active");
}

function register(){

    let user =
    registerUser.value.trim();

    let pass =
    registerPass.value;

    if(user.length < 3){

        message.innerText =
        "Username too short";

        return;
    }

    if(pass.length < 8){

        message.innerText =
        "Password must be 8+ characters";

        return;
    }

    localStorage.setItem(
    "username",user);

    localStorage.setItem(
    "password",pass);

    message.style.color =
    "#22c55e";

    message.innerText =
    "Registration Successful";

    setTimeout(showLogin,1000);
}

function login(){

    let user =
    loginUser.value.trim();

    let pass =
    loginPass.value;

    let savedUser =
    localStorage.getItem(
    "username");

    let savedPass =
    localStorage.getItem(
    "password");

    if(
    user===savedUser &&
    pass===savedPass){

        startMagicSequence();

    }else{

        message.style.color =
        "#ef4444";

        message.innerText =
        "Wrong Username or Password";
    }
}

function googleLogin(){

    startMagicSequence();
}

function startMagicSequence(){

    document.querySelector(
    ".container").style.display =
    "none";

    document.getElementById(
    "magicAnimation").style.display =
    "flex";

    setTimeout(function(){

        document.getElementById(
        "magicAnimation").style.display =
        "none";

        document.getElementById(
        "lobby").style.display =
        "block";

    },3000);
}

function logout(){

    document.getElementById(
    "lobby").style.display =
    "none";

    document.querySelector(
    ".container").style.display =
    "block";

    loginUser.value="";
    loginPass.value="";
}

</script>

</body>
</html>
